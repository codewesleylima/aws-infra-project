# Gitleaks Configuration
# Detects secrets in git repositories
# See: https://github.com/gitleaks/gitleaks

[build]
rules = []

[allowlist]
description = "Allowlist for security documentation and test files"
paths = [
  ".*/SECURITY_SECRETS\\.md",
  ".*/\\.env\\.example",
  ".*/\\.env\\.test",
  ".*/secret-scanner\\.yml",
  ".*/validate-no-secrets\\.sh"
]
regexes = [
  "REDACTED",
  "BEGIN PRIVATE KEY",
  "BEGIN RSA PRIVATE KEY"
]
commits = [
  "cb615e63cefdfb8e66277ce6cbe3b727cf8556ec"  # Security documentation commit
]