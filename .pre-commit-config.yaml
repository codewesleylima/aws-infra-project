# Pre-commit hook configuration
# Install: pip install pre-commit
# Setup: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: detect-aws-credentials
        name: Detect AWS Credentials
        description: Prevents credentials from being committed
      - id: detect-private-key
        name: Detect Private Key
        description: Prevents private keys from being committed
      - id: check-merge-conflict
        name: Check for Merge Conflicts
        description: Check for files that would conflict in a merge
      - id: check-yaml
        name: Check YAML
        args: ['--unsafe']
      - id: check-toml
        name: Check TOML
      - id: end-of-file-fixer
        name: Fix End of File
        description: Ensures files end with a newline
      - id: trailing-whitespace
        name: Trim Trailing Whitespace
        args: [--markdown-template='']
      - id: check-added-large-files
        name: Check for Large Files
        args: ['--maxkb=1000']
        description: Prevent giant files from being committed
      - id: check-case-conflict
        name: Check for Case Conflicts
        description: Check for files that would conflict in case-insensitive filesystems
      - id: check-symlinks
        name: Check for Symlinks
        description: Check for symlinks which do not point to anything
      - id: check-executables-have-shebangs
        name: Check that executables have shebangs

  # Terraform formatting and validation
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.83.0
    hooks:
      - id: terraform_fmt
        name: Terraform Format
        description: Formats Terraform files
        args: ['-check=false', '-write=true']
      
      - id: terraform_validate
        name: Terraform Validate
        description: Validates Terraform files
        args: ['']
      
      - id: terraform_trivy
        name: Terraform Trivy Scan
        description: Security scanning with Trivy
        args: 
          - '--minimum-severity=CRITICAL'
      
      - id: terraform_tflint
        name: Terraform TFLint
        description: Linting with TFLint
        args: ['']
        stages: [commit]

  # YAML linting for workflows
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.32.0
    hooks:
      - id: yamllint
        name: YAML Lint
        description: Lints YAML files
        args: [-d, '{rules: {line-length: {max: 120}, indentation: {spaces: 2}}}']
        files: |
          (?x)^(
            \.github/workflows/.*|
            .*\.ya?ml
          )$

  # Shell script checking
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.5
    hooks:
      - id: shellcheck
        name: Shell Check
        description: Checks shell scripts
        args: ['--severity=warning']
        types: [shell]
        files: ^(scripts|\.github)/.*\.(sh|bash)$

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.35.0
    hooks:
      - id: markdownlint
        name: Markdown Lint
        description: Checks markdown files
        args: ['--ignore', 'node_modules']
        files: \.md$

  # JSON validation
  - repo: https://github.com/pre-commit/mirrors-jq
    rev: v1.7
    hooks:
      - id: pretty-format-json
        name: Pretty Format JSON
        args: ['--autofix']
        files: \.json$

# Configuration options
minimum_pre_commit_framework_version: '2.15.0'
fail_fast: false
