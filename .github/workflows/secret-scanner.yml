name: Secret Scanner

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]

permissions:
  contents: read
  security-events: write

jobs:
  # ============================================
  # GITLEAKS - Detect secret patterns
  # ============================================
  gitleaks:
    name: Scan for leaked secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ============================================
  # TRUFFLEHOG - Additional secret detection
  # ============================================
  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified --no-update --json
        continue-on-error: true

  # ============================================
  # GITGUARDIAN - Scan secrets
  # ============================================
  gitguardian:
    name: GitGuardian Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: GitGuardian scan
        uses: GitGuardian/ggshield-action@master
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        continue-on-error: true

  # ============================================
  # VALIDATE SECURITY - Check .gitignore rules
  # ============================================
  validate-security:
    name: Validate Security Guidelines
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check .gitignore exists
        run: |
          if [ ! -f ".gitignore" ]; then
            echo "❌ .gitignore not found"
            exit 1
          fi
          echo "✅ .gitignore found"

      - name: Check .env.example exists
        run: |
          if [ -f ".env.example" ]; then
            echo "✅ .env.example found (good practice)"
          else
            echo "⚠️  .env.example not found (recommended)"
          fi

      - name: Check for .env files
        run: |
          if find . -maxdepth 1 -name ".env*" ! -name ".env.example" -type f 2>/dev/null | grep -q .; then
            echo "❌ .env file committed (SECURITY RISK!)"
            exit 1
          fi
          echo "✅ No .env files committed"

      - name: Check for sensitive patterns
        run: |
          set +e
          # AWS Access Keys
          if grep -r "AKIA[0-9A-Z]\{16\}" . --exclude-dir=.git --exclude="*.md" 2>/dev/null; then
            echo "❌ AWS Access Key pattern found"
            exit 1
          fi
          # Private key patterns
          if grep -r "BEGIN RSA PRIVATE KEY\|BEGIN PRIVATE KEY" . --exclude-dir=.git 2>/dev/null; then
            echo "❌ Private key pattern found"
            exit 1
          fi
          echo "✅ No sensitive patterns detected"
