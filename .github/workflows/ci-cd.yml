name: CI/CD Pipeline

on:
  workflow_dispatch: {}
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]

permissions:
  contents: read
  pull-requests: write
  id-token: write

defaults:
  run:
    shell: bash

env:
  TF_VERSION: "1.6.6"
  AWS_REGION: "us-east-1"
  TERRAFORM_INIT_OPTS: "-input=false -lock=true"
  TERRAFORM_PLAN_OPTS: "-no-color"
  TERRAFORM_APPLY_OPTS: "-auto-approve"

jobs:
  # ============================================
  # SINGLE RUNNER - All tasks in sequence
  # ============================================
  pipeline:
    name: Complete CI/CD Pipeline
    runs-on: ubuntu-latest
    steps:
      # ============================================
      # 1. SETUP & VALIDATION
      # ============================================
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Terraform plugins
        uses: actions/cache@v3
        with:
          path: |
            ~/.terraform.d/plugin-cache
            ~/.terraform.d/plugins
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/*.tf') }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format (auto)
        run: terraform fmt -recursive
        working-directory: terraform

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Terraform Init (dev)
        run: terraform init -backend=false
        working-directory: terraform/environments/dev

      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform/environments/dev

      # ============================================
      # 2. LOCALSTACK SMOKE TEST
      # ============================================
      - name: Start LocalStack
        run: |
          docker run -d --name localstack \
            -p 4566:4566 \
            -e SERVICES="s3,ec2,ecs,rds,iam,secretsmanager,cloudwatch" \
            -e DEBUG=0 \
            -e LOCALSTACK_ACKNOWLEDGE_ACCOUNT_REQUIREMENT=1 \
            localstack/localstack:0.14.4

      - name: Wait for LocalStack
        run: |
          for i in {1..30}; do
            echo "Waiting for LocalStack ($i/30)..."
            if curl -s http://localhost:4566/health | grep -q '"running"'; then
              echo "LocalStack is running"; break
            fi
            sleep 5
          done

      - name: Terraform Init (localstack)
        run: terraform init
        working-directory: terraform/environments/dev

      - name: Terraform Plan (localstack)
        run: |
          export AWS_ACCESS_KEY_ID=test
          export AWS_SECRET_ACCESS_KEY=test
          export AWS_DEFAULT_REGION=${{ env.AWS_REGION }}
          terraform plan \
            -var='use_localstack=true' \
            -var='localstack_endpoint=http://localhost:4566' \
            -var='aws_access_key=test' \
            -var='aws_secret_key=test' \
            -out=tfplan
        working-directory: terraform/environments/dev

      # ============================================
      # 3. SECURITY SCAN
      # ============================================
      - name: Checkout code for security
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          output_format: sarif
          soft_fail: true

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform/
          soft_fail: true

      - name: Run Trivy (IaC scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: terraform/
          format: table

      # ============================================
      # 4. TERRAFORM PLAN (only on PR or develop branch)
      # ============================================
      - name: Terraform Plan (Conditional)
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
        run: |
          echo "Running Terraform Plan..."
          terraform init $TERRAFORM_INIT_OPTS
          terraform plan $TERRAFORM_PLAN_OPTS -out=tfplan 2>&1 | tee plan.txt
        working-directory: terraform/environments/dev

      - name: Comment Plan on PR (Conditional)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('terraform/environments/dev/plan.txt', 'utf8').substring(0, 2000);

            const output = `#### Terraform Plan \`dev\`

<details><summary>Show Plan Output</summary>

\`\`\`terraform
${planOutput}
\`\`\`

</details>

*Pushed by: @${{ github.actor }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      # ============================================
      # 5. DEPLOY (only on develop branch push)
      # ============================================
      - name: Deploy to Dev (Conditional)
        if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
        run: |
          echo "Deploying to development environment..."
          # Configure AWS credentials (would need secrets)
          # terraform apply -auto-approve tfplan
          echo "Deployment would happen here"

      # ============================================
      # PIPELINE COMPLETE
      # ============================================
      - name: Pipeline Complete
        run: echo "✅ CI/CD Pipeline completed successfully!"
