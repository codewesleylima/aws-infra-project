name: CI/CD Pipeline

on:
  workflow_dispatch: {}
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]

permissions:
  contents: read
  pull-requests: write
  id-token: write

defaults:
  run:
    shell: bash

env:
  TF_VERSION: "1.6.6"
  AWS_REGION: "us-east-1"
  TERRAFORM_INIT_OPTS: "-input=false -lock=true"
  TERRAFORM_PLAN_OPTS: "-no-color"
  TERRAFORM_APPLY_OPTS: "-auto-approve"

jobs:
  # ============================================
  # SINGLE RUNNER - All tasks in sequence
  # ============================================
  pipeline:
    name: Complete CI/CD Pipeline
    runs-on: ubuntu-latest
    steps:
      # ============================================
      # 1. SETUP & VALIDATION
      # ============================================
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Terraform plugins
        uses: actions/cache@v3
        with:
          path: |
            ~/.terraform.d/plugin-cache
            ~/.terraform.d/plugins
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/*.tf') }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format (auto)
        run: terraform fmt -recursive
        working-directory: terraform

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Terraform Init (dev)
        run: terraform init -backend=false
        working-directory: terraform/environments/dev

      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform/environments/dev

      # ============================================
      # 2. LOCALSTACK SMOKE TEST
      # ============================================
      - name: Start LocalStack
        run: |
          docker run -d --name localstack \
            -p 4566:4566 \
            -e SERVICES="s3,ec2,ecs,rds,iam,secretsmanager,cloudwatch" \
            -e DEBUG=0 \
            -e LOCALSTACK_ACKNOWLEDGE_ACCOUNT_REQUIREMENT=1 \
            localstack/localstack:0.14.4

      - name: Wait for LocalStack
        run: |
          # Exponential backoff: 1s, 2s, 4s, 8s, 16s, 32s (max 10 retries)
          attempt=0
          max_attempts=10
          backoff=1
          while [ $attempt -lt $max_attempts ]; do
            attempt=$((attempt + 1))
            echo "Waiting for LocalStack (attempt $attempt/$max_attempts, backoff ${backoff}s)..."
            if curl -m 3 -s http://localhost:4566/health | grep -q '"running"'; then
              echo "✅ LocalStack is running"
              break
            fi
            if [ $attempt -lt $max_attempts ]; then
              sleep $backoff
              # Double backoff but cap at 32 seconds
              backoff=$((backoff * 2))
              [ $backoff -gt 32 ] && backoff=32
            else
              echo "❌ LocalStack failed to start after $max_attempts attempts"
              exit 1
            fi
          done

      - name: Terraform Init (localstack)
        run: terraform init
        working-directory: terraform/environments/dev

      - name: Terraform Plan (localstack)
        run: |
          export AWS_ACCESS_KEY_ID=test
          export AWS_SECRET_ACCESS_KEY=test
          export AWS_DEFAULT_REGION=${{ env.AWS_REGION }}
          terraform plan \
            -var='use_localstack=true' \
            -var='localstack_endpoint=http://localhost:4566' \
            -var='aws_access_key=test' \
            -var='aws_secret_key=test' \
            -out=tfplan
        working-directory: terraform/environments/dev

      # ============================================
      # 3. SECURITY SCAN
      # ============================================
      - name: Checkout code for security
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          output_format: sarif
          soft_fail: true

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform/
          soft_fail: true

      - name: Run Trivy (IaC scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: terraform/
          format: table

